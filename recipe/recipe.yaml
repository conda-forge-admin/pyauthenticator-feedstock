schema_version: 1

context:
  name: pyauthenticator
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyauthenticator-${{ version }}.tar.gz
  sha256: e580e6031fe3f833344d1870b62c05c9aaf53a0c246bc0837bb3ace0d4ef86f2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyauthenticator=pyauthenticator._cmd:command_line_parser
      - pyauthenticator-mcp=pyauthenticator.mcp_server:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pyotp >=2.10.0
    - qrcode >=8.2
    - pyzbar >=0.1.9
    - pillow >=12.1.0
tests:
  - python:
      imports:
        - pyauthenticator
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pyauthenticator --help

about:
  summary: Similar to the Google authenticator just written in python.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/jan-janssen/pyauthenticator

extra:
  recipe-maintainers:
    - jan-janssen
